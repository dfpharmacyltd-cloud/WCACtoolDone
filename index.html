    <script>
      // Safeguard against libraries (e.g. formdata-polyfill) attempting direct assignment to window.fetch
      (function() {
        try {
          var originalFetch = window.fetch;
          if (originalFetch) {
            var currentFetch = originalFetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('Custom fetch property setter setup skipped:', e);
        }
      })();
    </script>
